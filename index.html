<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Get2Share · You Get2 be in the picture</title>
    <meta name="theme-color" content="#050506" />
    <link rel="manifest" id="app-manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <script>
      // Share Spots and TVs install as their own full-screen apps.
      (function () {
        var p = location.pathname.replace(/\/+$/, '');
        var m = p === '/spot' ? '/manifest-spot.webmanifest' : p === '/tv' ? '/manifest-tv.webmanifest' : null;
        if (m) document.getElementById('app-manifest').setAttribute('href', m);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
