<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Get2Share · You're in the group photo. Now you Get2.</title>
    <meta name="description" content="Live photo sharing for events. Guests scan a code and every photo lands in one shared gallery. You're in the group photo. Now you Get2." />
    <meta name="theme-color" content="#050506" />
    <!-- Link previews (iMessage, WhatsApp, Slack, social): the same Get2Share card for every link. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Get2Share" />
    <meta property="og:url" content="https://share.get2.one/" />
    <meta property="og:title" content="Get2Share · Get the photos you're in" />
    <meta property="og:description" content="You're in the group photo. You never get it. Now you Get2. Every photo from the party lands on everyone's phone. No app to download." />
    <meta property="og:image" content="https://share.get2.one/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Get2Share: You're in the group photo. You never get it. Now you Get2." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Get2Share · Get the photos you're in" />
    <meta name="twitter:description" content="You're in the group photo. You never get it. Now you Get2." />
    <meta name="twitter:image" content="https://share.get2.one/og-image.png" />
    <!-- Dark from the very first frame, before the stylesheet arrives. -->
    <style>html,body{background:#050506}</style>
    <script>
      // On the landing page, start the Flick card's image right away (it's the biggest thing on a phone's first screen).
      if ((location.pathname.replace(/\/+$/, '') || '/') === '/') {
        var l = document.createElement('link');
        l.rel = 'preload'; l.as = 'image'; l.href = '/media/flick-poster-v3.webp'; l.setAttribute('fetchpriority', 'high');
        document.head.appendChild(l);
      }
    </script>
    <!-- Open connections early: fonts, plus Firebase sign-in and database, so a guest's first scan isn't waiting on them -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://identitytoolkit.googleapis.com" crossorigin />
    <link rel="preconnect" href="https://securetoken.googleapis.com" crossorigin />
    <link rel="preconnect" href="https://firestore.googleapis.com" crossorigin />
    <!-- Fonts load without blocking the first paint; text shows in a system font for a moment, then swaps. -->
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;700&display=swap" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;700&display=swap" media="print" onload="this.media='all'" />
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;700&display=swap" /></noscript>
    <link rel="manifest" id="app-manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <script>
      // Share Spots and TVs install as their own full-screen apps.
      (function () {
        var p = location.pathname.replace(/\/+$/, '');
        var m = p === '/spot' ? '/manifest-spot.webmanifest' : p === '/tv' ? '/manifest-tv.webmanifest' : null;
        if (m) document.getElementById('app-manifest').setAttribute('href', m);
      })();
    </script>
    <!-- Vercel Web Analytics and Speed Insights. Join codes, host event IDs and anything after "?" (pairing/screen codes) are replaced before sending. -->
    <script>
      (function () {
        function scrub(event) {
          try {
            var u = new URL(event.url);
            u.pathname = u.pathname
              .replace(/^\/e\/[^/]+/, '/e/[code]')
              .replace(/^\/host\/[^/]+/, '/host/[event]');
            u.search = '';
            u.hash = '';
            var out = Object.assign({}, event, { url: u.toString() });
            if (out.route) out.route = u.pathname;
            return out;
          } catch (e) { return null; }
        }
        window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
        window.si = window.si || function () { (window.siq = window.siq || []).push(arguments); };
        window.va('beforeSend', scrub);
        window.si('beforeSend', scrub);
      })();
    </script>
    <script defer src="/_vercel/insights/script.js"></script>
    <script defer src="/_vercel/speed-insights/script.js" data-sdkn="@vercel/speed-insights" data-sdkv="2.1.0"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
