<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Get2Share · You Get2 be in the picture</title>
    <meta name="theme-color" content="#050506" />
    <!-- Open connections early: fonts, plus Firebase sign-in and database, so a guest's first scan isn't waiting on them -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://identitytoolkit.googleapis.com" crossorigin />
    <link rel="preconnect" href="https://securetoken.googleapis.com" crossorigin />
    <link rel="preconnect" href="https://firestore.googleapis.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;700&display=swap" />
    <link rel="manifest" id="app-manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <script>
      // Share Spots and TVs install as their own full-screen apps.
      (function () {
        var p = location.pathname.replace(/\/+$/, '');
        var m = p === '/spot' ? '/manifest-spot.webmanifest' : p === '/tv' ? '/manifest-tv.webmanifest' : null;
        if (m) document.getElementById('app-manifest').setAttribute('href', m);
      })();
    </script>
    <!-- Vercel Web Analytics. Join codes, host event IDs and anything after "?" (pairing/screen codes) are replaced before sending. -->
    <script>
      window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
      window.va('beforeSend', function (event) {
        try {
          var u = new URL(event.url);
          u.pathname = u.pathname
            .replace(/^\/e\/[^/]+/, '/e/[code]')
            .replace(/^\/host\/[^/]+/, '/host/[event]');
          u.search = '';
          u.hash = '';
          return Object.assign({}, event, { url: u.toString() });
        } catch (e) { return null; }
      });
    </script>
    <script defer src="/_vercel/insights/script.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
